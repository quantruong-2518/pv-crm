# Deploy CHỈ từ GỐC REPO — build context phải thấy packages/engines,
# packages/contracts, giống hệt điều kiện đã ghi ở đầu apps/api/Dockerfile:
#
#     fly deploy . --config apps/api/fly.toml --app pvone-crm-api
#
# KHÔNG truyền thêm `--dockerfile`: đường dẫn của `--dockerfile` VÀ của
# `[build] dockerfile` bên dưới được flyctl tính tương đối với thư mục CHỨA
# `fly.toml` (tức `apps/api/`), không phải tương đối với build context — do
# đó giá trị đúng là "Dockerfile" trần, không phải "apps/api/Dockerfile". Đã
# vấp lỗi `dockerfile '.../apps/api/apps/api/Dockerfile' not found` thật khi
# để sai, ghi lại đây để khỏi vấp lại.
#
# KHÔNG dùng buildpack: Fly.io tự khuyến cáo không dùng buildpack cho monorepo
# pnpm — đúng gotcha symlink `.pnpm` mà Dockerfile đã giải thủ công. Chi tiết
# và điều kiện chọn Fly.io/Neon: docs/ban-giao-api.md § "Nơi chạy".
#
app = "pvone-crm-api"
primary_region = "sin" # Singapore — gần VN nhất, Fly.io chưa có region tại VN

# Biến KHÔNG phải secret thì khai ở đây (theo repo, ai đọc cũng thấy) — chỉ
# `DATABASE_URL` mới qua `fly secrets set` vì đó là thứ thật sự nhạy cảm.
[env]
NODE_ENV = "production"

# Hộp thư nhận báo "có lead mới từ landing page". KHÔNG phải secret — địa chỉ
# công ty thì ai đọc repo cũng nên thấy, đúng luật đã ghi ở
# `docs/van-hanh-mail.md` § "Secret trên Fly": chỉ RESEND_API_KEY và
# RESEND_WEBHOOK_SECRET mới đi qua `fly secrets set`.
#
# ĐỂ TRỐNG LÀ TẮT CẢ ĐƯỜNG ỐNG, không phải "gửi cho không ai": E4 bỏ luôn ý
# định gửi khi audience rỗng (`plan()` trả `[]`), nên intake chấp nhận lead mà
# KHÔNG sinh dòng nào trong `platform.email_delivery` — worker có chạy cũng
# không có gì để nhặt. Đó đúng là trạng thái production đã nằm im từ 27/08.
#
# Đặt biến này KHÔNG làm thư bay ra ngoài: `PV_EMAIL_ENABLED` vẫn vắng nên
# mặc định `false` và driver là console. Sổ gửi có dòng, thư dừng đúng một tấc
# trước khi rời máy — chính là trạng thái doc yêu cầu phải có TRƯỚC bước canary.
PV_LEAD_NOTIFICATION_TO = "contact@pebblevina.com"

[build]
dockerfile = "Dockerfile"

# Hai process, MỘT image — đúng thiết kế `src/worker.ts` đã ghi: đổi lệnh
# chạy, không đổi image. CMD gốc trong Dockerfile là cho `api`; `worker` đè
# lệnh chạy ở đây.
[processes]
api = "node --enable-source-maps -r tsconfig-paths/register dist/apps/api/src/main.js"
worker = "node --enable-source-maps -r tsconfig-paths/register dist/apps/api/src/worker.js"

[http_service]
internal_port = 3000
processes = ["api"]
force_https = true
# Giữ máy API luôn chạy — không auto-stop. Cold-start vài giây khi Sale mở
# Sổ lead là trải nghiệm tệ hơn vài USD/tháng tiết kiệm được.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

# Đo tải theo request HTTP. Khi một máy chạm hard_limit, Fly Proxy ngừng đưa
# thêm request vào máy đó; limiter riêng của intake vẫn chặn chặt hơn ở route
# công khai và dùng Postgres để đồng bộ giữa nhiều máy.
[http_service.concurrency]
type = "requests"
soft_limit = 30
hard_limit = 50

[[http_service.checks]]
grace_period = "20s"
interval = "15s"
method = "GET"
path = "/healthz"
timeout = "3s"

# Kích thước máy: mặc định Fly (shared-cpu-1x) đủ cho quy mô hiện tại. Chỉnh
# riêng từng process bằng `fly scale vm --process-group worker ...` sau khi
# app đã tồn tại — không đoán syntax `[[vm]]` theo process ở đây khi chưa
# kiểm bằng CLI thật.
