<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="PV One" />
    <meta name="description" content="PV One — hệ thống CRM của Pebble Vina." />
    <meta name="theme-color" content="#0b1220" />
    <!-- Real customer data lives behind RequireAccess (see routes.tsx) —
         nothing here should ever reach a search index. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://crm.pebblevina.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crm.pebblevina.com/" />
    <meta property="og:site_name" content="PV One" />
    <meta property="og:title" content="PV One · Pebble Vina" />
    <meta property="og:description" content="Hệ thống CRM của Pebble Vina." />
    <meta property="og:image" content="/brand/og-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pebble Vina" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PV One · Pebble Vina" />
    <meta name="twitter:description" content="Hệ thống CRM của Pebble Vina." />
    <meta name="twitter:image" content="/brand/og-logo.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-blue-32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-light-32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chỉ nạp weight thật sự có trong code (luật 6 · docs/luat-thiet-ke.md):
         Archivo 600 + 700 (<b> ở AppSidebar) · Space Grotesk 600 + 700 (KioskTile)
         · Plex Sans 400/500/600/700 (font body, 700 cho nút kiosk tương phản cao)
         · Plex Mono 400 + 600 (Kicker).
         Bỏ Archivo 500, Space Grotesk 500, Mono 500 — không chỗ nào gọi tới.
         Thêm Plex Sans 700 — `kiosk-tile.tsx:50` gọi font-bold trên font body mà
         weight đó chưa từng được nạp, trình duyệt phải bôi đậm giả. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pebble Vina",
        "url": "https://pebblevina.com",
        "logo": "/brand/mark-blue-512.png"
      }
    </script>
    <title>PV One · Pebble Vina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
