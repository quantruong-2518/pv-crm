<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand asset renderer</title>
    <style>
      html,
      body,
      canvas {
        display: block;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="output"></canvas>
    <script type="module">
      const query = new URLSearchParams(location.search)
      const width = Number(query.get('width'))
      const height = Number(query.get('height'))
      const padding = Number(query.get('padding') ?? 0)
      const tone = query.get('tone') ?? 'blue'
      const colorSource = query.get('color')

      if (!width || !height || !colorSource) {
        throw new Error('width, height and color are required')
      }

      const load = (src) =>
        new Promise((resolve, reject) => {
          const image = new Image()
          image.onload = () => resolve(image)
          image.onerror = () => reject(new Error(`Cannot load ${src}`))
          image.src = src
        })

      const image = await load(colorSource)
      const source = document.createElement('canvas')
      source.width = image.width
      source.height = image.height
      const sourceContext = source.getContext('2d', { willReadFrequently: true })
      sourceContext.drawImage(image, 0, 0)
      const pixels = sourceContext.getImageData(0, 0, source.width, source.height)

      let left = source.width
      let top = source.height
      let right = -1
      let bottom = -1

      for (let y = 0; y < source.height; y += 1) {
        for (let x = 0; x < source.width; x += 1) {
          const offset = (y * source.width + x) * 4
          if (pixels.data[offset + 3] < 8) continue
          const red = pixels.data[offset]
          const green = pixels.data[offset + 1]
          const blue = pixels.data[offset + 2]
          if (tone === 'light') {
            if (Math.max(red, green, blue) < 130 && blue >= red) {
              pixels.data[offset] = 238
              pixels.data[offset + 1] = 242
              pixels.data[offset + 2] = 251
            } else if (blue > red * 1.5 && blue > green * 1.1) {
              pixels.data[offset] = red + (255 - red) * 0.25
              pixels.data[offset + 1] = green + (255 - green) * 0.25
              pixels.data[offset + 2] = blue + (255 - blue) * 0.25
            }
          }
          left = Math.min(left, x)
          top = Math.min(top, y)
          right = Math.max(right, x)
          bottom = Math.max(bottom, y)
        }
      }

      if (right < left || bottom < top) throw new Error('Alpha source is empty')
      sourceContext.putImageData(pixels, 0, 0)

      const output = document.querySelector('#output')
      output.width = width
      output.height = height
      const context = output.getContext('2d')
      context.imageSmoothingEnabled = true
      context.imageSmoothingQuality = 'high'

      const cropWidth = right - left + 1
      const cropHeight = bottom - top + 1
      const availableWidth = width - padding * 2
      const availableHeight = height - padding * 2
      const scale = Math.min(availableWidth / cropWidth, availableHeight / cropHeight)
      const drawWidth = cropWidth * scale
      const drawHeight = cropHeight * scale
      const drawX = (width - drawWidth) / 2
      const drawY = (height - drawHeight) / 2
      context.drawImage(
        source,
        left,
        top,
        cropWidth,
        cropHeight,
        drawX,
        drawY,
        drawWidth,
        drawHeight,
      )
      document.documentElement.dataset.ready = 'true'
    </script>
  </body>
</html>
